[package]
name = "wildcat-studio"
version = "1.0.0"
description = "Wildcat Studio - High-Performance Cartridge CAD & Ballistic Suite"
authors = ["WildcatStudio"]
edition = "2021"

[lib]
name = "wildcat_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
