name: Bug Report
description: Report an issue or unexpected CAD behavior in Wildcat Studio
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with **Wildcat Studio**!

  - type: input
    id: app_version
    attributes:
      label: Wildcat Studio Version
      description: Found in the bottom status bar or Help dialog (e.g. v1.0.0).
      placeholder: "e.g. v1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you using?
      options:
        - "macOS (Apple Silicon - M1/M2/M3/M4)"
        - "macOS (Intel x64)"
        - "Windows 10 / 11 (64-bit)"
        - "Linux (.AppImage / .deb)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: Clear and concise description of what went wrong.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Open cartridge '6mm ARC'
        2. Adjust shoulder angle to 35 degrees
        3. Observe volumetrics recalculation
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
