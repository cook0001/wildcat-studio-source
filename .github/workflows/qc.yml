name: Quality Control (QC)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  frontend-qc:
    name: Frontend TypeScript & Vite QC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck Verification
        run: npx tsc --noEmit

      - name: Production Bundle & Mangling Verification
        run: npm run build

  rust-qc:
    name: Rust Backend & Algorithmic QC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo Clippy Linter
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Volumetric & Parser Unit Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --verbose
